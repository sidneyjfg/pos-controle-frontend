name: Publish Frontend Image

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image suffix
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            SUFFIX="develop"
            API_BASE_URL="${{ vars.VITE_API_BASE_URL_DEVELOP }}"
          else
            SUFFIX="prod"
            API_BASE_URL="${{ vars.VITE_API_BASE_URL_PROD }}"
          fi

          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::Configure VITE_API_BASE_URL_${SUFFIX^^} em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${OWNER}/${REPOSITORY}-${SUFFIX}"

          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${API_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.meta.outputs.api_base_url }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=pos-controle-frontend
